<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 682" role="img" aria-labelledby="title desc">
  <title id="title">Apexify.js — Build visual systems from code</title>
  <desc id="desc">Apexify.js brand banner with an exact current ApexPainter createCanvas example and current rendering domains.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="2048" y2="682" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071326"/>
      <stop offset=".55" stop-color="#081730"/>
      <stop offset="1" stop-color="#0A1740"/>
    </linearGradient>
    <linearGradient id="apex" x1="100" y1="190" x2="260" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#055CFF"/>
      <stop offset=".4" stop-color="#1B9DFF"/>
      <stop offset=".68" stop-color="#28DDE9"/>
      <stop offset="1" stop-color="#8A27FF"/>
    </linearGradient>
    <linearGradient id="inner" x1="170" y1="118" x2="220" y2="196" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE5FF"/>
    </linearGradient>
    <linearGradient id="headline" x1="100" y1="350" x2="700" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A5FFF"/>
      <stop offset=".55" stop-color="#1C91FF"/>
      <stop offset="1" stop-color="#19D9E7"/>
    </linearGradient>
    <linearGradient id="js" x1="680" y1="70" x2="830" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5A55FF"/>
      <stop offset=".5" stop-color="#168FFF"/>
      <stop offset="1" stop-color="#10DCE3"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#34558D" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="2048" height="682" fill="url(#bg)"/>
  <rect width="2048" height="682" fill="url(#grid)"/>
  <ellipse cx="1488" cy="344" rx="450" ry="260" fill="#244CFF" opacity=".08" filter="url(#soft)"/>
  <ellipse cx="1890" cy="140" rx="180" ry="150" fill="#7629FF" opacity=".12" filter="url(#soft)"/>

  <g transform="translate(94 54)">
    <rect x="0" y="37" width="36" height="36" rx="9" fill="#16DDE5"/>
    <rect x="160" y="80" width="36" height="36" rx="9" fill="#C320FF"/>
    <path d="M20 158 96 8 172 158" fill="none" stroke="url(#apex)" stroke-width="35" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m98 99 34 59" fill="none" stroke="url(#inner)" stroke-width="26" stroke-linecap="round"/>
    <text x="218" y="128" fill="#F4F7FF" font-family="Inter, Geist, Segoe UI, Arial, sans-serif" font-size="92" font-weight="820" letter-spacing="-5">Apexify</text>
    <text x="633" y="128" fill="url(#js)" font-family="Inter, Geist, Segoe UI, Arial, sans-serif" font-size="92" font-weight="820" letter-spacing="-4">.js</text>
  </g>

  <text x="102" y="300" fill="#F4F7FF" font-family="Inter, Geist, Segoe UI, Arial, sans-serif" font-size="78" font-weight="820" letter-spacing="-4">Build visual systems</text>
  <text x="102" y="382" fill="url(#headline)" font-family="Georgia, Times New Roman, serif" font-size="82" font-style="italic" font-weight="600" letter-spacing="-3">from code.</text>
  <text x="105" y="445" fill="#AEBEDD" font-family="Inter, Geist, Segoe UI, Arial, sans-serif" font-size="24">A TypeScript-first programmable visual engine for images, typography,</text>
  <text x="105" y="480" fill="#AEBEDD" font-family="Inter, Geist, Segoe UI, Arial, sans-serif" font-size="24">scenes, templates, charts, media workflows, and audio.</text>

  <g font-family="Inter, Geist, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650">
    <g transform="translate(104 524)"><rect width="128" height="82" rx="18" fill="#0B1B39" stroke="#244A82"/><text x="64" y="49" text-anchor="middle" fill="#DCE8FF">Images</text></g>
    <g transform="translate(244 524)"><rect width="146" height="82" rx="18" fill="#0B1B39" stroke="#3B3D8A"/><text x="73" y="49" text-anchor="middle" fill="#DCE8FF">Typography</text></g>
    <g transform="translate(402 524)"><rect width="130" height="82" rx="18" fill="#0B1B39" stroke="#205A8B"/><text x="65" y="49" text-anchor="middle" fill="#DCE8FF">Scenes</text></g>
    <g transform="translate(544 524)"><rect width="142" height="82" rx="18" fill="#0B1B39" stroke="#4B3891"/><text x="71" y="49" text-anchor="middle" fill="#DCE8FF">Templates</text></g>
    <g transform="translate(698 524)"><rect width="128" height="82" rx="18" fill="#0B1B39" stroke="#197D74"/><text x="64" y="49" text-anchor="middle" fill="#DCE8FF">Charts</text></g>
    <g transform="translate(838 524)"><rect width="170" height="82" rx="18" fill="#0B1B39" stroke="#7B3186"/><text x="85" y="49" text-anchor="middle" fill="#DCE8FF">Video workflows</text></g>
  </g>

  <g transform="translate(1110 126)">
    <rect width="826" height="438" rx="24" fill="#071225" stroke="#397AF3" stroke-width="2"/>
    <rect x="1" y="1" width="824" height="64" rx="23" fill="#0B1A34"/>
    <circle cx="34" cy="32" r="9" fill="#FF5C69"/><circle cx="62" cy="32" r="9" fill="#FFC14E"/><circle cx="90" cy="32" r="9" fill="#28C96F"/>
    <rect x="640" y="16" width="150" height="32" rx="8" fill="#0C2345" stroke="#244A82"/>
    <rect x="652" y="23" width="25" height="18" rx="4" fill="#087AE8"/>
    <text x="665" y="37" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">TS</text>
    <text x="689" y="37" fill="#DCE8FF" font-family="Inter, Arial, sans-serif" font-size="15">TypeScript</text>
    <text x="44" y="104" fill="#90A2C3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">1</text>
    <text x="78" y="104" fill="#F079FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">import</text>
    <text x="152" y="104" fill="#DCE8FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">{ ApexPainter }</text>
    <text x="324" y="104" fill="#F079FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">from</text>
    <text x="380" y="104" fill="#25E2B7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">'apexify.js';</text>

    <text x="44" y="158" fill="#90A2C3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">2</text>
    <text x="78" y="158" fill="#46B6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">const painter =</text>
    <text x="252" y="158" fill="#F079FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">new</text>
    <text x="297" y="158" fill="#46B6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">ApexPainter</text>
    <text x="430" y="158" fill="#DCE8FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">({ type:</text>
    <text x="524" y="158" fill="#25E2B7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">'buffer'</text>
    <text x="617" y="158" fill="#DCE8FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">});</text>

    <text x="44" y="212" fill="#90A2C3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">3</text>
    <text x="78" y="212" fill="#46B6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">const canvas =</text>
    <text x="248" y="212" fill="#F079FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">await</text>
    <text x="310" y="212" fill="#DCE8FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">painter.createCanvas({</text>

    <text x="44" y="266" fill="#90A2C3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">4</text>
    <text x="116" y="266" fill="#DCE8FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">width:</text>
    <text x="194" y="266" fill="#FFB452" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">1200,</text>

    <text x="44" y="310" fill="#90A2C3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">5</text>
    <text x="116" y="310" fill="#DCE8FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">height:</text>
    <text x="205" y="310" fill="#FFB452" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">630,</text>

    <text x="44" y="354" fill="#90A2C3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">6</text>
    <text x="116" y="354" fill="#DCE8FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">colorBg:</text>
    <text x="220" y="354" fill="#25E2B7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">'#101622',</text>

    <text x="44" y="398" fill="#90A2C3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">7</text>
    <text x="78" y="398" fill="#DCE8FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">});</text>
  </g>
</svg>
