name: Phase 11 Lockfile Refresh

on:
  push:
    branches:
      - phase11/dependency-source-api-cleanup

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase11/dependency-source-api-cleanup
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - name: Remove proven-unused dependencies using npm and refresh lockfile
        run: |
          npm uninstall --package-lock-only --ignore-scripts fs-extra jszip
          node - <<'NODE'
          const pkg = require('./package.json');
          for (const name of ['fs-extra', 'jszip']) {
            if (pkg.dependencies?.[name]) throw new Error(`${name} still declared`);
          }
          NODE
      - name: Commit deterministic manifest and lockfile update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git rm .github/workflows/phase11-lockfile-refresh.yml
          git commit -m "chore(phase11): remove unused runtime dependencies"
          git push origin HEAD:phase11/dependency-source-api-cleanup
