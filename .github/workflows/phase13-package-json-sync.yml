name: Phase 13 Git dependency metadata sync

on:
  push:
    branches:
      - reengineering/phase-13-git-package-consumption

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reengineering/phase-13-git-package-consumption
          fetch-depth: 0
      - name: Add Git dependency prepare lifecycle
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.scripts = {
            clean: pkg.scripts.clean,
            typecheck: pkg.scripts.typecheck,
            'build:js': pkg.scripts['build:js'],
            'build:types': pkg.scripts['build:types'],
            build: pkg.scripts.build,
            prepare: 'node scripts/prepare-git-install.cjs',
            ...Object.fromEntries(Object.entries(pkg.scripts).filter(([key]) => !['clean','typecheck','build:js','build:types','build','prepare'].includes(key))),
          };
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - name: Commit metadata
        run: |
          if git diff --quiet -- package.json; then
            echo "package.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Phase 13: prepare staged Git dependencies before packing"
          git push origin HEAD:reengineering/phase-13-git-package-consumption
