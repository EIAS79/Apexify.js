name: Runtime, Package, and Release Gate

on:
  workflow_dispatch:
  push:
    branches:
      - reengineering/phase-2-runtime-package-release
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    name: Node ${{ matrix.node }} / dual package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1

      - name: Runtime snapshot
        run: |
          node --version
          npm --version

      - name: Install FFmpeg integration dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install locked dependency graph
        run: npm ci --ignore-scripts

      - name: Build and verify emitted module formats
        run: npm run build

      - name: Phase 1 security regression suite
        run: npm run test:security

      - name: Phase 3 runtime regression suite
        run: npm run test:phase3

      - name: Phase 4 validation regression suite
        run: npm run test:phase4

      - name: Phase 5 raster regression suite
        run: npm run test:phase5

      - name: Phase 6 composition regression suite
        run: npm run test:phase6

      - name: Phase 7 GIF regression suite
        run: npm run test:phase7

      - name: Phase 8 video regression suite
        run: npm run test:phase8

      - name: Phase 9 audio regression suite
        run: npm run test:phase9

      - name: Phase 10 completeness scan
        run: node scripts/phase10-completeness-scan.cjs

      - name: Phase 10 fixture build
        run: node scripts/build-phase10-fixture.mjs

      - name: Phase 10 runtime boundary probe
        run: timeout --signal=TERM 45s node tests/phase10-runtime-probe.cjs

      - name: Phase 10 runtime regression suite
        run: timeout --signal=TERM 60s node tests/phase10-runtime.cjs

      - name: Phase 10 collage semantics suite
        run: node tests/phase10-collage-semantics.cjs

      - name: Phase 10 fuzz suite
        run: node tests/phase10-fuzz.cjs

      - name: Phase 10 golden suite
        run: node tests/phase10-golden.cjs

      - name: Phase 10 benchmark gate
        run: node --expose-gc tests/phase10-benchmark.cjs

      - name: Install packed package into clean ESM/CJS fixtures
        run: node scripts/verify-packed-package.cjs

      - name: Prove prepack rebuilds clean dist
        shell: bash
        run: |
          npm run clean
          test ! -d dist
          npm pack --silent
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          const required = [
            'dist/esm/index.js',
            'dist/cjs/index.cjs',
            'dist/declarations/index.d.ts',
            'dist/declarations-cjs/index.d.cts',
          ];
          for (const file of required) {
            if (!fs.existsSync(file)) throw new Error(`prepack rebuild missing ${file}`);
          }
          const filename = `${pkg.name}-${pkg.version}.tgz`;
          if (!fs.existsSync(filename)) throw new Error(`prepack tarball missing: ${filename}`);
          fs.writeFileSync(
            'phase2-prepack-node-${{ matrix.node }}.json',
            JSON.stringify({
              node: process.version,
              filename,
              distRemovedBeforePack: true,
              rebuiltArtifacts: required,
            }, null, 2) + '\n'
          );
          fs.rmSync(filename, { force: true });
          console.log('prepack lifecycle rebuilt dist from an absent state and produced the required package artifacts.');
          NODE

      - name: Inspect npm pack contents
        run: npm pack --dry-run --ignore-scripts --json > phase2-pack-node-${{ matrix.node }}.json

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high --json > phase2-audit-node-${{ matrix.node }}.json

      - name: Upload package evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase2-package-node-${{ matrix.node }}
          path: |
            package-lock.json
            phase2-prepack-node-${{ matrix.node }}.json
            phase2-pack-node-${{ matrix.node }}.json
            phase2-audit-node-${{ matrix.node }}.json
            phase10-benchmark-node-${{ matrix.node }}.json
          if-no-files-found: warn
