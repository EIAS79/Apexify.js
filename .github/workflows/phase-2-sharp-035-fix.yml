name: Temporary Sharp 0.35 API Fix

on:
  push:
    branches:
      - reengineering/phase-2-runtime-package-release
    paths:
      - .github/workflows/phase-2-sharp-035-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reengineering/phase-2-runtime-package-release

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply asserted Sharp 0.35 API fixes
        run: node scripts/phase2-sharp-035-fix.cjs

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib-next/core/general-functions.ts lib-next/render/context-image-filters.ts
          git diff --cached --check
          git commit -m "fix(sharp): adopt 0.35 output and sharpen APIs"
          git push origin HEAD:reengineering/phase-2-runtime-package-release
