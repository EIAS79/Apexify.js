name: Apexify Core CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: apexify-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Node 24 / core correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: UTC
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      APEXIFY_BENCH_FONT_FAMILY: DejaVu Sans
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1

      - name: Install deterministic media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          fc-match 'DejaVu Sans'

      - name: Install locked dependency graph
        run: npm ci --ignore-scripts

      - name: Build and typecheck
        run: npm run build

      - name: Core deterministic regression gate
        run: npm run test:core

      - name: Source maintenance audit
        run: npm run audit:maintenance
