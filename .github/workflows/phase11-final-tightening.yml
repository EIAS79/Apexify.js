name: Phase 11 Final Tightening

on:
  push:
    branches:
      - phase11/dependency-source-api-cleanup

permissions:
  contents: write

jobs:
  tighten:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase11/dependency-source-api-cleanup
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - name: Remove final avoidable any usage and enforce it
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          function replaceRequired(file, from, to) {
            let text = fs.readFileSync(file, 'utf8');
            if (!text.includes(from)) throw new Error(`Expected pattern missing in ${file}: ${from}`);
            text = text.replace(from, to);
            fs.writeFileSync(file, text);
          }

          const comparison = 'lib-next/chart/impl/comparisonchart.ts';
          replaceRequired(comparison, '    const props: any = {};\n', '');
          replaceRequired(comparison, '        props.legends = pieOptions.legends;\n', '        return { legends: pieOptions.legends };\n');
          replaceRequired(comparison, '        props.legend = otherOptions.legend;\n', '        return { legend: otherOptions.legend };\n');
          replaceRequired(comparison, '    return props;\n', '    return {};\n');
          replaceRequired(comparison, '  const chart1Options: any = {\n', '  const chart1Options = {\n');
          replaceRequired(comparison, '  const chart2Options: any = {\n', '  const chart2Options = {\n');
          replaceRequired(
            comparison,
            '    chart1Options.type = options.chart1.barType;\n',
            '    (chart1Options as BarChartOptions).type = options.chart1.barType;\n'
          );
          replaceRequired(
            comparison,
            '    chart2Options.type = options.chart2.barType;\n',
            '    (chart2Options as BarChartOptions).type = options.chart2.barType;\n'
          );

          const audit = 'scripts/maintenance-audit.cjs';
          replaceRequired(
            audit,
            "  for (const hit of report.hygiene.markerHits) failures.push(`unfinished source marker: ${hit.path}:${hit.line}`);\n  for (const hit of report.hygiene.consoleHits) failures.push(`library console output: ${hit.path}:${hit.line}`);",
            "  for (const hit of report.hygiene.markerHits) failures.push(`unfinished source marker: ${hit.path}:${hit.line}`);\n  for (const hit of report.hygiene.avoidableAnyCandidates) failures.push(`avoidable any: ${hit.path}:${hit.line}`);\n  for (const hit of report.hygiene.consoleHits) failures.push(`library console output: ${hit.path}:${hit.line}`);"
          );
          NODE
      - name: Verify final tightening
        run: |
          npm run build
          npm run audit:maintenance
          npm run test:compat
          node scripts/verify-packed-package.cjs
      - name: Commit validated tightening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib-next/chart/impl/comparisonchart.ts scripts/maintenance-audit.cjs
          git commit -m "refactor(phase11): eliminate final avoidable any boundaries"
          git push origin HEAD:phase11/dependency-source-api-cleanup
