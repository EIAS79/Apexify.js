name: Publish Apexify.js to npm

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact package version to publish
        required: true
        default: '6.0.0'

permissions:
  contents: read
  id-token: write

concurrency:
  group: apexify-npm-publish
  cancel-in-progress: false

jobs:
  publish-next:
    name: Publish verified package to npm next
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1

      - name: Verify requested version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          node -e "const p=require('./package.json'); if (p.version !== process.env.EXPECTED_VERSION) { console.error('Expected ' + process.env.EXPECTED_VERSION + ' but package.json is ' + p.version); process.exit(1); }"

      - name: Install FFmpeg and deterministic font dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          fc-match 'DejaVu Sans'

      - name: Install locked dependency graph
        run: npm ci --ignore-scripts

      - name: Publish to npm next
        run: npm publish --tag next --access public

      - name: Verify registry artifact
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          test "$(npm view apexify.js@${EXPECTED_VERSION} version)" = "${EXPECTED_VERSION}"
          test "$(npm view apexify.js dist-tags.next)" = "${EXPECTED_VERSION}"
