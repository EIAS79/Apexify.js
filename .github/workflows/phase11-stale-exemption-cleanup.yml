name: Phase 11 Stale Exemption Cleanup

on:
  push:
    branches:
      - phase11/final-stale-exemption-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase11/final-stale-exemption-cleanup
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - name: Remove stale Phase 11 audit exemption
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/maintenance-audit.cjs';
          let text = fs.readFileSync(file, 'utf8');
          const from = "  if (r === 'scripts/maintenance-audit.cjs' || r === 'scripts/phase11-audit.cjs') continue;";
          const to = "  if (r === 'scripts/maintenance-audit.cjs') continue;";
          if (!text.includes(from)) throw new Error('Expected stale Phase 11 exemption is missing');
          text = text.replace(from, to);
          fs.writeFileSync(file, text);
          NODE
      - name: Verify corrective cleanup
        run: |
          npm run build
          npm run audit:maintenance
          npm run test:compat
          node scripts/verify-packed-package.cjs
      - name: Commit validated cleanup and remove temporary workflow
        run: |
          rm .github/workflows/phase11-stale-exemption-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/maintenance-audit.cjs .github/workflows/phase11-stale-exemption-cleanup.yml
          git commit -m "chore(phase11): remove stale audit exemption"
          git push origin HEAD:phase11/final-stale-exemption-cleanup
