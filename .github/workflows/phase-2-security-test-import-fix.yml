name: Temporary Security Test Import Fix

on:
  push:
    branches:
      - reengineering/phase-2-runtime-package-release
    paths:
      - .github/workflows/phase-2-security-test-import-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reengineering/phase-2-runtime-package-release
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply asserted import migration
        run: node scripts/phase2-security-test-import-codemod.cjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/security-phase1.cjs
          git diff --cached --check
          git commit -m "test(security): load internals from private source bundle"
          git push origin HEAD:reengineering/phase-2-runtime-package-release
