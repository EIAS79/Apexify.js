name: Phase 3 Diagnostics Sweep

on:
  push:
    branches:
      - reengineering/phase-3-core-architecture

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reengineering/phase-3-core-architecture
          fetch-depth: 0
      - name: Migrate unmanaged diagnostics
        shell: python
        run: |
          from pathlib import Path
          import os, re

          root = Path('lib-next')
          touched = []
          pattern = re.compile(r'console\.(warn|error)\s*\(')

          for file in sorted(root.rglob('*.ts')):
              text = file.read_text(encoding='utf-8')
              if not pattern.search(text):
                  continue

              lines = text.splitlines(keepends=True)
              changed = False
              for i, line in enumerate(lines):
                  match = pattern.search(line)
                  if not match:
                      continue
                  if ');' not in line[match.start():]:
                      raise SystemExit(f'{file}:{i+1}: multi-line console diagnostic requires manual migration')
                  level = match.group(1)
                  indent = line[:len(line) - len(line.lstrip())]
                  stem = re.sub(r'[^A-Za-z0-9]+', '_', file.stem).strip('_').upper() or 'LIBRARY'
                  code = f'APEXIFY_{stem}_{level.upper()}'
                  replacement = (
                      f'{indent}emitDiagnostic({{ level: "{level}", code: "{code}", '
                      f'message: "A non-fatal Apexify {level} diagnostic was emitted by {file.as_posix()}." }});\n'
                  )
                  lines[i] = replacement
                  changed = True

              if not changed:
                  continue

              new_text = ''.join(lines)
              target = Path('lib-next/runtime/diagnostics')
              rel = os.path.relpath(target, file.parent).replace(os.sep, '/')
              if not rel.startswith('.'):
                  rel = './' + rel
              import_line = f'import {{ emitDiagnostic }} from "{rel}";\n'
              if import_line not in new_text:
                  new_text = import_line + new_text
              file.write_text(new_text, encoding='utf-8')
              touched.append(file.as_posix())

          remaining = []
          for file in root.rglob('*.ts'):
              if pattern.search(file.read_text(encoding='utf-8')):
                  remaining.append(file.as_posix())
          if remaining:
              raise SystemExit('Unmanaged diagnostics remain: ' + ', '.join(remaining))
          if not touched:
              raise SystemExit('No diagnostics migrated')
          print('\n'.join(touched))
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/phase3-diagnostics-sweep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib-next .github/workflows/phase3-diagnostics-sweep.yml
          git commit -m "refactor(phase3): route remaining diagnostics through runtime hook"
          git push origin HEAD:reengineering/phase-3-core-architecture
