name: Phase 5 one-shot source fix

on:
  push:
    branches:
      - reengineering/phase-5-raster-pipeline

permissions:
  contents: write

jobs:
  patch-and-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reengineering/phase-5-raster-pipeline
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1

      - name: Fix explicit-zero chart shadows
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = [
            'lib-next/chart/impl/barchart.ts',
            'lib-next/chart/impl/horizontalbarchart.ts',
            'lib-next/chart/impl/linechart.ts',
            'lib-next/chart/impl/piechart.ts',
          ];
          for (const file of files) {
            const before = fs.readFileSync(file, 'utf8');
            const after = before
              .replaceAll('style.shadow.offsetX || 2', 'style.shadow.offsetX ?? 2')
              .replaceAll('style.shadow.offsetY || 2', 'style.shadow.offsetY ?? 2');
            if (after === before) {
              throw new Error(`Expected chart shadow replacements were not found in ${file}`);
            }
            fs.writeFileSync(file, after);
          }
          NODE

      - name: Regenerate lockfile without Jimp
        run: npm install --package-lock-only --ignore-scripts

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/phase5-one-shot-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib-next/chart/impl/barchart.ts \
                  lib-next/chart/impl/horizontalbarchart.ts \
                  lib-next/chart/impl/linechart.ts \
                  lib-next/chart/impl/piechart.ts \
                  package-lock.json \
                  .github/workflows/phase5-one-shot-fix.yml
          git diff --cached --check
          git commit -m "fix: preserve zero chart shadow offsets and refresh lock"
          git push origin HEAD:reengineering/phase-5-raster-pipeline
