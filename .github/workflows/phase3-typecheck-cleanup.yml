name: Phase 3 Typecheck Cleanup

on:
  push:
    branches:
      - reengineering/phase-3-core-architecture

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reengineering/phase-3-core-architecture
          fetch-depth: 0
      - name: Remove stale diagnostic local
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib-next/canvas/background-renderer.ts')
          text = p.read_text(encoding='utf-8')
          old = '    } catch (e: unknown) {\n      const msg = e instanceof Error ? e.message : String(e);\n      emitDiagnostic({ level: "warn", code: "APEXIFY_BACKGROUND_RENDERER_WARN", message: "A non-fatal Apexify warn diagnostic was emitted by lib-next/canvas/background-renderer.ts." });\n'
          new = '    } catch {\n      emitDiagnostic({ level: "warn", code: "APEXIFY_BACKGROUND_RENDERER_WARN", message: "A non-fatal Apexify warn diagnostic was emitted by lib-next/canvas/background-renderer.ts." });\n'
          if old not in text:
              raise SystemExit('target not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/phase3-typecheck-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib-next/canvas/background-renderer.ts .github/workflows/phase3-typecheck-cleanup.yml
          git commit -m "fix(phase3): remove stale diagnostic local"
          git push origin HEAD:reengineering/phase-3-core-architecture
