name: Phase 5 one-shot palette compatibility

on:
  push:
    branches:
      - reengineering/phase-5-raster-pipeline

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reengineering/phase-5-raster-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Restore total-pixel frequency semantics
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'lib-next/core/general-functions.ts';
          let text = fs.readFileSync(file, 'utf8');
          const marker = '    const counts = new Map<number, number>();\n    let visiblePixels = 0;';
          if (!text.includes(marker)) throw new Error('palette count marker not found');
          text = text.replace(marker, '    const counts = new Map<number, number>();\n    const totalPixels = data.length / 4;\n    let visiblePixels = 0;');
          const frequency = 'frequency: ((count / visiblePixels) * 100).toFixed(2),';
          if (!text.includes(frequency)) throw new Error('palette frequency marker not found');
          text = text.replace(frequency, 'frequency: ((count / totalPixels) * 100).toFixed(2),');
          fs.writeFileSync(file, text);
          NODE
      - name: Verify compatibility
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          node scripts/build-phase3-fixture.mjs
          node tests/phase3-compat.cjs
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/phase5-one-shot-palette-compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib-next/core/general-functions.ts .github/workflows/phase5-one-shot-palette-compat.yml
          git diff --cached --check
          git commit -m "fix: preserve palette frequency compatibility"
          git push origin HEAD:reengineering/phase-5-raster-pipeline
