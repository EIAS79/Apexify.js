name: Temporary Phase 2 Sharp Migration

on:
  push:
    branches:
      - reengineering/phase-2-runtime-package-release
    paths:
      - .github/workflows/phase-2-sharp-codemod.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reengineering/phase-2-runtime-package-release

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1

      - name: Apply asserted Sharp type migration
        run: node scripts/phase2-sharp-type-codemod.cjs

      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit migration and lockfile
        run: |
          if git diff --quiet -- lib-next/core/general-functions.ts lib-next/render/context-image-filters.ts package-lock.json; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib-next/core/general-functions.ts lib-next/render/context-image-filters.ts package-lock.json
          git commit -m "fix(types): migrate Sharp 0.35 types and lock dependencies"
          git push origin HEAD:reengineering/phase-2-runtime-package-release
