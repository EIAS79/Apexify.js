name: Phase 5 one-shot pattern validation hardening

on:
  push:
    branches: [reengineering/phase-5-raster-pipeline]
    paths: [.github/workflows/phase5-one-shot-pattern-validation.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reengineering/phase-5-raster-pipeline
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Harden pattern defaults and validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          renderer = Path('lib-next/canvas/pattern-renderer.ts')
          text = renderer.read_text()
          text = text.replace('import type { PatternOptions, PatternViewport, RenderPatternStackOptions } from "../types";\n', 'import type { PatternOptions, PatternViewport, RenderPatternStackOptions } from "../types";\nimport { validatePatternOptions } from "./canvas-validation";\n')
          needle = '    if (!patternOptions || !patternOptions.type) return;\n\n    const cw = viewport.width;'
          replacement = '    if (!patternOptions || !patternOptions.type) return;\n    validatePatternOptions(patternOptions, "pattern");\n\n    const cw = viewport.width;'
          if needle not in text:
              raise SystemExit('pattern render validation insertion point missing')
          text = text.replace(needle, replacement)
          text = text.replace('options.size || 20', 'options.size ?? 20')
          text = text.replace('options.spacing || 10', 'options.spacing ?? 10')
          text = text.replace("options.repeat || 'repeat'", "options.repeat ?? 'repeat'")
          text = text.replace("options.secondaryColor || 'transparent'", "options.secondaryColor ?? 'transparent'")
          renderer.write_text(text)

          validation = Path('lib-next/canvas/canvas-validation.ts')
          text = validation.read_text()
          text = text.replace('import type { CanvasConfig } from "../types";', 'import type { CanvasConfig, PatternOptions } from "../types";')
          anchor = 'const BG_TYPES = ["color", "gradient", "image", "pattern", "presetPattern", "noise"] as const;\n\n'
          helper = '''const PATTERN_TYPES = ["grid", "dots", "diagonal", "stripes", "waves", "crosses", "hexagons", "checkerboard", "diamonds", "triangles", "stars", "polka", "custom"] as const;\nconst PATTERN_REPEAT = ["repeat", "repeat-x", "repeat-y", "no-repeat"] as const;\n\nexport function validatePatternOptions(pattern: PatternOptions, name = "pattern"): void {\n  assertRecord(pattern, name);\n  assertEnum(pattern.type, `${name}.type`, PATTERN_TYPES);\n  assertOpacity(pattern.opacity, `${name}.opacity`);\n  assertOptionalFiniteNumber(pattern.size, `${name}.size`, { min: 0, exclusiveMin: true });\n  assertOptionalFiniteNumber(pattern.spacing, `${name}.spacing`, { min: 0 });\n  assertOptionalFiniteNumber(pattern.rotation, `${name}.rotation`);\n  assertOptionalFiniteNumber(pattern.scale, `${name}.scale`, { min: 0, exclusiveMin: true });\n  assertOptionalFiniteNumber(pattern.offsetX, `${name}.offsetX`);\n  assertOptionalFiniteNumber(pattern.offsetY, `${name}.offsetY`);\n  assertOptionalEnum(pattern.repeat, `${name}.repeat`, PATTERN_REPEAT);\n  if (pattern.color !== undefined) assertNonEmptyString(pattern.color, `${name}.color`, 512);\n  if (pattern.secondaryColor !== undefined) assertNonEmptyString(pattern.secondaryColor, `${name}.secondaryColor`, 512);\n  if (pattern.type === "custom") {\n    assertNonEmptyString(pattern.customPatternImage, `${name}.customPatternImage`, 16_384);\n  }\n  assertFiniteNumericLeaves(pattern, name);\n}\n\n'''
          if anchor not in text:
              raise SystemExit('canvas validation helper insertion point missing')
          text = text.replace(anchor, anchor + helper)
          old = '''  if (layer.type === "presetPattern") {\n    assertRecord(layer.pattern, `${name}.pattern`);\n    assertFiniteNumericLeaves(layer.pattern, `${name}.pattern`);\n  }'''
          new = '''  if (layer.type === "presetPattern") {\n    validatePatternOptions(layer.pattern as PatternOptions, `${name}.pattern`);\n  }'''
          if old not in text:
              raise SystemExit('presetPattern validation block missing')
          text = text.replace(old, new)
          old = '''  if (canvas.patternBg !== undefined) {\n    assertRecord(canvas.patternBg, "canvas.patternBg");\n    assertFiniteNumericLeaves(canvas.patternBg, "canvas.patternBg");\n  }'''
          new = '''  if (canvas.patternBg !== undefined) {\n    validatePatternOptions(canvas.patternBg, "canvas.patternBg");\n  }'''
          if old not in text:
              raise SystemExit('patternBg validation block missing')
          text = text.replace(old, new)
          validation.write_text(text)
          PY
      - name: Verify source
        run: |
          npm ci
          npm run typecheck
          node scripts/phase5-raster-scan.cjs
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/phase5-one-shot-pattern-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib-next/canvas/pattern-renderer.ts lib-next/canvas/canvas-validation.ts .github/workflows/phase5-one-shot-pattern-validation.yml
          git commit -m 'fix: validate custom pattern geometry and zero spacing'
          git push origin HEAD:reengineering/phase-5-raster-pipeline
