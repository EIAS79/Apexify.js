name: Phase 3 Process Policy Cleanup

on:
  push:
    branches:
      - reengineering/phase-3-core-architecture

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reengineering/phase-3-core-architecture
          fetch-depth: 0
      - name: Apply process policy cleanup
        run: node scripts/phase3-process-policy-cleanup.cjs
      - name: Commit cleanup
        run: |
          git rm .github/workflows/phase3-process-policy-cleanup.yml scripts/phase3-process-policy-cleanup.cjs
          git add lib-next/video/video-helpers.ts lib-next/video/extract-frame.ts lib-next/video/extract-all-frames.ts lib-next/video/extract-interval-frames.ts lib-next/video/ffprobe-metadata.ts scripts/phase3-bypass-scan.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(phase3): centralize remaining process bounds"
          git push origin HEAD:reengineering/phase-3-core-architecture
