name: Phase 3 final bypass correction

on:
  push:
    branches:
      - reengineering/phase-3-core-architecture

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[phase3-pattern-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reengineering/phase-3-core-architecture
          fetch-depth: 0
      - run: node scripts/phase3-pattern-scan-fix.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib-next/canvas/pattern-renderer.ts
          git commit -m "fix: resolve custom pattern through central media input [phase3-pattern-fixed]"
          git push origin HEAD:reengineering/phase-3-core-architecture
