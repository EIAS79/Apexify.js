name: Phase 14-P Source Verification

on:
  workflow_dispatch:
  push:
    branches:
      - phase14p-performance-recovery
    paths:
      - 'lib-next/**'
      - 'benchmarks/phase14p/**'
      - 'tests/phase9-*.cjs'
      - 'tests/phase14-regressions.cjs'
      - 'scripts/build-phase9-fixture.mjs'
      - 'scripts/build-test-fixture.mjs'
      - 'scripts/build-phase14p-benchmark-fixture.mjs'
      - '.github/workflows/phase14p-verify.yml'

permissions:
  contents: read

concurrency:
  group: apexify-phase14p-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    name: Build + targeted recovery verification / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - name: Install FFmpeg and deterministic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck and build package
        run: npm run build
      - name: Build Phase 14-P internal benchmark fixture
        run: node scripts/build-phase14p-benchmark-fixture.mjs
      - name: Text PNG semantic and bounded-fallback regression
        run: node benchmarks/phase14p/text-png-regression.cjs
      - name: Text stage benchmark
        env:
          APEXIFY_BENCH_FONT_FAMILY: DejaVu Sans
        run: node --expose-gc benchmarks/phase14p/text-stage-bench.cjs
      - name: Permanent Phase 14-P multi-domain stage benchmarks
        env:
          APEXIFY_BENCH_FONT_FAMILY: DejaVu Sans
        run: node --expose-gc benchmarks/phase14p/stage-benchmarks.cjs --output artifacts/phase14p/stage-benchmarks.json
      - name: Upload stage benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase14p-stage-benchmarks-node24-${{ github.sha }}
          path: artifacts/phase14p/stage-benchmarks.json
          if-no-files-found: error
      - name: Phase 9 audio regression suite
        run: npm run test:phase9
      - name: Phase 14 regression suite
        run: npm run test:phase14
      - name: Public API compatibility
        run: npm run test:compat
