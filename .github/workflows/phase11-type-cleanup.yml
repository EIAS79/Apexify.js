name: Phase 11 Type Cleanup

on:
  push:
    branches:
      - phase11/dependency-source-api-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase11/dependency-source-api-cleanup
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - name: Replace avoidable canvas-gradient and image-domain any usage
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const castFiles = [
            'lib-next/chart/impl/barchart.ts',
            'lib-next/chart/impl/comparisonchart.ts',
            'lib-next/chart/impl/horizontalbarchart.ts',
            'lib-next/chart/impl/linechart.ts',
            'lib-next/chart/impl/piechart.ts',
            'lib-next/image/image-creator.ts',
            'lib-next/image/shapes/shapes.ts',
          ];
          for (const file of castFiles) {
            const before = fs.readFileSync(file, 'utf8');
            const after = before.replace(/ as any/g, '');
            if (after !== before) fs.writeFileSync(file, after);
          }

          const file = 'lib-next/image/image-creator.ts';
          let text = fs.readFileSync(file, 'utf8');
          const replacements = [
            [
              'import type { ImageProperties, ShapeType, ShapeProperties, CreateImageOptions, StrokeOptions } from "../types";',
              'import type { ImageProperties, ShapeType, ShapeProperties, CreateImageOptions, StrokeOptions, ShadowOptions, BoxBackground, ImageFilter, gradient } from "../types";'
            ],
            ['    gradient: any,', '    gradient: gradient | undefined,'],
            ['    shadow: any,', '    shadow: ShadowOptions,'],
            ['    stroke: any,', '    stroke: StrokeOptions,'],
            ['    shapeProps: any', '    shapeProps: ShapeProperties'],
            ['      shadow?: any;', '      shadow?: ShadowOptions;'],
            ['      stroke?: any;', '      stroke?: StrokeOptions;'],
            ['      boxBackground?: any;', '      boxBackground?: BoxBackground;'],
            ['      gradient?: any;', '      gradient?: gradient;'],
            ['      filters?: any[];', '      filters?: ImageFilter[];'],
          ];
          for (const [from, to] of replacements) {
            if (!text.includes(from)) throw new Error(`Expected type-cleanup pattern missing: ${from}`);
            text = text.split(from).join(to);
          }
          fs.writeFileSync(file, text);

          const bar = 'lib-next/chart/impl/barchart.ts';
          text = fs.readFileSync(bar, 'utf8');
          const from = '): { buffer: Buffer; ctx: SKRSContext2D; canvas: any } {';
          const to = '): { buffer: Buffer; ctx: SKRSContext2D; canvas: ReturnType<typeof createCanvas> } {';
          if (!text.includes(from)) throw new Error('Expected barchart canvas type pattern missing');
          fs.writeFileSync(bar, text.replace(from, to));
          NODE
      - name: Typecheck and declaration-build cleanup
        run: |
          npm run typecheck
          npm run build:types
      - name: Re-run maintenance audit snapshot
        run: node scripts/maintenance-audit.cjs
      - name: Commit validated cleanup and remove one-off workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib-next
          git rm .github/workflows/phase11-type-cleanup.yml
          git commit -m "refactor(phase11): reduce avoidable any at canvas boundaries"
          git push origin HEAD:phase11/dependency-source-api-cleanup
