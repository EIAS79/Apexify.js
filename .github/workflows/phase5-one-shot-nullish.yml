name: Phase 5 one-shot nullish fixes

on:
  push:
    branches: [reengineering/phase-5-raster-pipeline]
    paths: [.github/workflows/phase5-one-shot-nullish.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reengineering/phase-5-raster-pipeline
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Fix explicit-zero fallbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'lib-next/canvas/pattern-renderer.ts': [('const scale = options.scale || 1;', 'const scale = options.scale ?? 1;')],
              'lib-next/chart/impl/barchart.ts': [('ctx.shadowBlur = style.shadow.blur || 4;', 'ctx.shadowBlur = style.shadow.blur ?? 4;')],
              'lib-next/chart/impl/horizontalbarchart.ts': [('ctx.shadowBlur = style.shadow.blur || 4;', 'ctx.shadowBlur = style.shadow.blur ?? 4;')],
              'lib-next/chart/impl/linechart.ts': [('ctx.shadowBlur = style.shadow.blur || 4;', 'ctx.shadowBlur = style.shadow.blur ?? 4;')],
              'lib-next/chart/impl/piechart.ts': [('ctx.shadowBlur = style.shadow.blur || 4;', 'ctx.shadowBlur = style.shadow.blur ?? 4;')],
          }
          for file, pairs in replacements.items():
              path = Path(file)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {file}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Verify source
        run: |
          npm ci
          npm run typecheck
          node scripts/phase5-raster-scan.cjs
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/phase5-one-shot-nullish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib-next/canvas/pattern-renderer.ts lib-next/chart/impl/barchart.ts lib-next/chart/impl/horizontalbarchart.ts lib-next/chart/impl/linechart.ts lib-next/chart/impl/piechart.ts .github/workflows/phase5-one-shot-nullish.yml
          git commit -m 'fix: preserve explicit zero raster style values'
          git push origin HEAD:reengineering/phase-5-raster-pipeline
