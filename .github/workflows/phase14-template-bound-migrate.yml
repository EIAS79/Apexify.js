name: Phase 14 Bounded Template Migration

on:
  push:
    branches:
      - phase14/final-audit-release-candidate

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[phase14-template-bound]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase14/final-audit-release-candidate
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Bound template collection and measurement fan-out
        run: node scripts/phase14-template-bound-migrate.cjs

      - name: Verify patch
        run: |
          git diff --check
          git diff -- lib-next/template/resolve-template.ts

      - name: Commit bounded template source
        run: |
          if git diff --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib-next/template/resolve-template.ts
          git commit -m 'Phase 14: bound template layout fan-out [phase14-template-bound]'
          git push origin HEAD:phase14/final-audit-release-candidate
